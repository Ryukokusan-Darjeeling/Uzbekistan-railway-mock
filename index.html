<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欧亚茶路 · 清流官博弈沙盒 | CKU Railway</title>
  <meta name="description" content="19世纪清朝铁路贸易线博弈沙盒——汉口至恰克图，旁观自私流官与商人的兴衰">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F4E8C1'/%3E%3Cpath d='M6 24 L12 14 L18 19 L26 8' stroke='%238B3A1A' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='6' cy='24' r='3' fill='%23B87333'/%3E%3Ccircle cx='26' cy='8' r='3' fill='%23B87333'/%3E%3C/svg%3E">

  <!-- Google Fonts：复古衬线 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Special+Elite&family=Courier+Prime&display=swap" rel="stylesheet">

  <!-- Leaflet（本地化，避免 CDN 在部分网络环境不可用） -->
  <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
  <script src="lib/leaflet/leaflet.js"></script>

  <!-- 复古样式 -->
  <link rel="stylesheet" href="js/ui/style/retro.css">
</head>
<body class="cku2-app">

  <header class="cku2-header">
    <div>
      <h1>欧亚茶路 · 清流官博弈沙盒</h1>
      <div class="reign" id="cku2Date">道光 1845 年 1 月 · 第 1 月</div>
    </div>
    <div class="controls">
      <button id="btnCku2Advance">推进下月</button>
      <button id="btnCku2Advance6">快进六月</button>
      <button id="btnCku2Reset" class="ghost">重置</button>
    </div>
  </header>

  <div id="cku2Status" style="margin-bottom:8px"></div>

  <!-- 智能体决策流（回合推进时的实时交流/决策时间线） -->
  <div id="cku2AgentStream" class="cku2-agent-stream" style="display:none"></div>

  <div class="cku2-legend" style="margin-bottom:8px">
    <span><span class="line-land"></span>北运陆路主线</span>
    <span><span class="line-border"></span>避税支线</span>
    <span style="color:var(--ink)">汉口 → 樊城 → 赊旗 → 太原 → 张家口 → 库伦 → 恰克图</span>
  </div>

  <div class="cku2-main">
    <!-- 左列：地图 + 指标 + 参数 -->
    <div>
      <div class="cku2-card cku2-map" id="cku2Map"></div>
      <div id="cku2Metrics" style="margin-top:16px"></div>
      <div id="cku2Params" style="margin-top:16px"></div>
    </div>

    <!-- 右列：官员 + 商人 + 日志 -->
    <div>
      <div id="cku2Officials"></div>
      <div id="cku2Merchants" style="margin-top:16px"></div>
      <div id="cku2Log" style="margin-top:16px"></div>
    </div>
  </div>

  <!-- engine（纯逻辑，禁止 DOM） -->
  <script src="js/engine/state.js"></script>
  <script src="js/engine/llm.js"></script>
  <script src="js/engine/institution.js"></script>
  <script src="js/engine/economy.js"></script>
  <script src="js/engine/agents.js"></script>
  <script src="js/engine/orchestrator.js"></script>

  <!-- ui（渲染与交互） -->
  <script src="js/ui/map.js"></script>
  <script src="js/ui/panel.js"></script>
  <script src="js/ui/log.js"></script>

  <!-- 本地私有配置（API Key，已 gitignore） -->
  <script src="js/config.local.js"></script>

  <!-- 主入口 -->
  <script src="js/ui/app.js"></script>

</body>
</html>
